<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Electrical BOQ Analyzer</title>
    <link rel="icon" type="image/png" href="/favicon.ico" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f3efe5;
        --card: #fffdf8;
        --ink: #1f2a2e;
        --muted: #56656b;
        --accent: #0d6b66;
        --accent-2: #d8a13d;
        --border: #d6d1c4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(216, 161, 61, 0.18), transparent 32%),
          linear-gradient(135deg, #f8f5ec 0%, #ece7dc 100%);
      }

      main {
        max-width: 1080px;
        margin: 0 auto;
        padding: 48px 20px 64px;
      }

      .hero {
        display: grid;
        gap: 20px;
        margin-bottom: 28px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 6vw, 4rem);
        line-height: 0.96;
        letter-spacing: -0.04em;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.6;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 18px;
      }

      .card {
        background: rgba(255, 253, 248, 0.92);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 24px;
        backdrop-filter: blur(16px);
        box-shadow: 0 20px 50px rgba(54, 49, 36, 0.09);
      }

      form {
        display: grid;
        gap: 14px;
      }

      input[type="file"] {
        width: 100%;
        padding: 14px;
        border: 1px dashed var(--border);
        border-radius: 16px;
        background: #fff;
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 14px 18px;
        font: inherit;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(135deg, var(--accent), #114f67);
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: "SFMono-Regular", "Consolas", monospace;
        font-size: 0.88rem;
      }

      .summary {
        font-size: 1.05rem;
        color: var(--ink);
      }

      .status {
        color: var(--muted);
        min-height: 1.4em;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <h1>Electrical Drawing BOQ Analyzer</h1>
        <p>Upload a drawing PDF to extract OCR text, detect components, and generate BOQ JSON, CSV, and a readable quantity table.</p>
      </section>

      <section class="grid">
        <article class="card">
          <form id="uploader">
            <input type="file" name="file" accept="application/pdf" required />
            <button type="submit">Analyze PDF</button>
            <div class="status" id="status"></div>
          </form>
        </article>

        <article class="card">
          <div class="summary" id="summary">No analysis yet.</div>
        </article>

        <article class="card">
          <h2>BOQ Table</h2>
          <pre id="table"></pre>
        </article>

        <article class="card">
          <h2>JSON Output</h2>
          <pre id="json"></pre>
        </article>
      </section>
    </main>

    <script>
      const form = document.getElementById("uploader");
      const statusNode = document.getElementById("status");
      const summaryNode = document.getElementById("summary");
      const tableNode = document.getElementById("table");
      const jsonNode = document.getElementById("json");
      const submitButton = form.querySelector("button");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        statusNode.textContent = "Running OCR and detection...";
        summaryNode.textContent = "Processing your file.";
        tableNode.textContent = "";
        jsonNode.textContent = "";
        submitButton.disabled = true;

        try {
          const response = await fetch("/api/upload", {
            method: "POST",
            body: new FormData(form),
          });
          const payload = await response.json();
          if (!response.ok) {
            throw new Error(payload.detail || "Upload failed");
          }
          statusNode.textContent = "Analysis complete.";
          summaryNode.textContent = payload.summary.human_readable;
          tableNode.textContent = payload.table;
          jsonNode.textContent = JSON.stringify(payload.json, null, 2);
        } catch (error) {
          statusNode.textContent = error.message;
          summaryNode.textContent = "Analysis did not complete.";
        } finally {
          submitButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
